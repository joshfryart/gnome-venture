<title>Crafting Area Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-width Satchel > Crafting mock. Map of 7 scene cards; tap one to open its scene with tappable objects. Tokens copied from game/assets/style.css. */
:root{--bg:#f1ece0;--surface:#fff3c8;--surface2:#f2e4c0;--ink:#2a1a10;--ink2:#4a2c1a;--muted:#74462a;--line:#c9a96e;--accent:#e8a317;--accent-ink:#7a4a1f;--felt:#3d2a1c;--felt-ink:#f2e4c0;--moss:#2f5a2a;--on-fill:#fff3c8;--lock:#7a4a1f;--ready:#2f5a2a;--font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--pill:999px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a10;--surface:#3d2a1c;--surface2:#4a2c1a;--ink:#f2e4c0;--ink2:#c9c5bc;--muted:#c9a96e;--line:#74462a;--accent-ink:#f5cf6a;--moss:#7fae6c;--on-fill:#2a1a10;--lock:#f5cf6a;--ready:#9ccf86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1a10;--surface:#3d2a1c;--surface2:#4a2c1a;--ink:#f2e4c0;--ink2:#c9c5bc;--muted:#c9a96e;--line:#74462a;--accent-ink:#f5cf6a;--moss:#7fae6c;--on-fill:#2a1a10;--lock:#f5cf6a;--ready:#9ccf86;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.tabs{display:flex;gap:4px;background:var(--felt);padding:6px;border-radius:12px}
.tabs span{flex:1;text-align:center;font-size:13px;padding:8px 4px;border-radius:8px;color:#c9a96e}
.tabs .on{background:#4a2c1a;color:#f2e4c0;font-weight:600;box-shadow:inset 0 -2px 0 #e8a317}
h1{font-size:20px;margin:0;line-height:1.2}
.sub{margin:0;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;color:inherit;font:inherit;min-width:0}
.card:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pic{position:relative;aspect-ratio:3/2;background:var(--surface2);overflow:hidden}
.pic img{display:block;width:100%;height:100%;image-rendering:pixelated;object-fit:cover}
.card.locked .pic img{filter:grayscale(.85) brightness(.8)}
.badge{position:absolute;right:6px;top:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:var(--pill);background:var(--felt);color:var(--felt-ink);border:1px solid var(--accent)}
.badge.lock{background:var(--lock);color:var(--on-fill)}
.cb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px}
.cb b{font-size:14px}
.bar{height:8px;border-radius:var(--pill);background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss)}
.cb small{font-size:12px;color:var(--muted)}
.back{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:0 14px;border-radius:var(--pill);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.strip button{flex:0 0 auto;width:76px;display:flex;flex-direction:column;gap:3px;align-items:center;background:none;border:2px solid transparent;border-radius:10px;padding:3px;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}
.strip img{width:68px;aspect-ratio:3/2;object-fit:cover;image-rendering:pixelated;border-radius:6px;border:2px solid var(--line)}
.strip button[aria-current="page"]{border-color:var(--accent);color:var(--ink);font-weight:700}
.scene{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);aspect-ratio:3/2;background:var(--surface2)}
.scene img{display:block;width:100%;height:100%;image-rendering:pixelated}
.hs{position:absolute;background:transparent;border:2px solid transparent;border-radius:10px;cursor:pointer;padding:0}
.hs span{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;background:var(--felt);color:var(--felt-ink);padding:2px 7px;border-radius:var(--pill);opacity:0;transition:opacity .12s;pointer-events:none}
.hs:hover,.hs:focus-visible,.hs.on{border-color:var(--accent);background:rgba(232,163,23,.18)}
.hs:hover span,.hs:focus-visible span,.hs.on span{opacity:1}
.pulse{position:absolute;right:10px;top:10px;font-size:11px;background:var(--felt);color:var(--felt-ink);padding:4px 9px;border-radius:var(--pill);border:1px solid var(--accent)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel h2{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:var(--pill);border:2px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#2a1a10;font-weight:700}
.rec{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface2);min-width:0}
.rec b{font-size:14px}.rec small{display:block;font-size:12px;color:var(--muted)}
.mk{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--pill);border:1px solid var(--line)}
.mk.ok{background:var(--moss);color:var(--on-fill);border-color:var(--moss)}
.lockmsg{font-size:13px;color:var(--lock);font-weight:600}
@media (prefers-reduced-motion:no-preference){.hs{transition:background .12s,border-color .12s}}
</style>
<div class="wrap" id="app"></div>
<script>
const D=/*DATA*/null;
const app=document.getElementById('app');
let cur=null, sel=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function head(){return `<p class="note">Mockup of Satchel &gt; Crafting. Pictures are the new scenes; recipes and counts are example data.</p><div class="tabs" aria-hidden="true"><span>Items</span><span class="on">Crafting</span><span>Pantry</span><span>Gear</span></div>`}
function map(){
 app.innerHTML=head()+`<h1>Where to craft?</h1><p class="sub">Tap an area.</p><div class="grid">`+D.map(a=>{
  const lock=a.lock==='lock';
  return `<button class="card${lock?' locked':''}" data-k="${a.key}" aria-label="${esc(a.label)}, ${a.have} of ${a.total} known${a.badge?', '+esc(a.badge):''}"><div class="pic"><img src="${a.img}" alt="">${a.badge?`<span class="badge${lock?' lock':''}">${lock?'&#128274; ':''}${esc(a.badge)}</span>`:''}</div><div class="cb"><b>${esc(a.label)}</b><div class="bar" aria-hidden="true"><i style="width:${Math.round(a.have/a.total*100)}%"></i></div><small>${a.have} of ${a.total} known</small></div></button>`}).join('')+`</div>`;
 app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{cur=b.dataset.k;sel=null;area();window.scrollTo(0,0)});
}
function area(){
 const a=D.find(x=>x.key===cur), lock=a.lock==='lock';
 const hsel=a.hs.find(h=>h.id===sel);
 app.innerHTML=head()+`<button class="back" id="back">&#128506; All areas</button><div class="strip" role="navigation" aria-label="Crafting areas">`+D.map(x=>`<button data-k="${x.key}"${x.key===cur?' aria-current="page"':''}><img src="${x.img}" alt="">${esc(x.label)}</button>`).join('')+`</div>
 <div><h1>${esc(a.label)}</h1><p class="sub">${esc(a.blurb)}</p></div>
 <div class="scene"><img src="${a.img}" alt="${esc(a.label)} scene">${a.hs.map(h=>`<button class="hs${h.id===sel?' on':''}" data-h="${h.id}" aria-label="${esc(h.label)}" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%"><span>${esc(h.label)}</span></button>`).join('')}</div>
 <div class="chips" role="group" aria-label="Objects in ${esc(a.label)}">${a.hs.map(h=>`<button class="chip" data-h="${h.id}" aria-pressed="${h.id===sel}">${esc(h.label)}</button>`).join('')}</div>
 <div class="panel" aria-live="polite">${lock?`<p class="lockmsg">&#128274; Needs a Tool Shed. Build one in Town to craft here.</p>`:''}${hsel?`<h2>${esc(hsel.label)}</h2>`+(hsel.rec.length?hsel.rec.map(r=>`<div class="rec"><div><b>${esc(r.n)}</b><small>${esc(r.i)}</small></div><span class="mk${r.ok&&!lock?' ok':''}">${lock?'Locked':r.ok?'Craft':'Missing'}</span></div>`).join(''):`<p class="sub">Nothing to craft here yet.</p>`):`<p class="sub">Tap an object in the picture, or a name above, to see what it makes.</p>`}</div>`;
 app.querySelector('#back').onclick=()=>{map();window.scrollTo(0,0)};
 app.querySelectorAll('.strip button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;sel=null;area()});
 app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{sel=b.dataset.h===sel?null:b.dataset.h;area()});
}
map();
</script>
