name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Lint and conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP lint (every .php file)
        run: |
          # combat_math_golden.php and fight_events.php redefine random_int() on purpose, which php -l reports as a fatal, so it is skipped
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { php -l "$f"; fail=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -not -name combat_math_golden.php -not -name fight_events.php -print0)
          exit $fail
      - name: Merge conflict markers (same check as tests/build_update.sh)
        run: |
          pat='^(<<<<<<<|=======|>>>>>>>)( |$)'
          if grep -rnE "$pat" game tests --include=*.php --include=*.js --include=*.css --include=*.txt --include=*.sh; then
            echo "Merge conflict markers found"; exit 1
          fi

  sqlite:
    name: SQLite suites (PHP ${{ matrix.php }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', 'latest']
        shard: [1, 2, 3, 4]   # the suite list is split over 4 parallel jobs (tests/ci_suites.sh SHARD / SHARDS)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, gd
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 'Playwright + Chromium (browser suites: fight_scene, fight_scene_trail, here)'   # 2.7.01
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Python art tools (catfish layers need numpy + Pillow)
        run: python3 -m pip install --quiet numpy pillow
      - name: db_migrate / give_item error handling
        run: php tests/db_errors.php
      - name: Install and playthrough
        run: |
          cp -r game "$RUNNER_TEMP/game"; rm -rf "$RUNNER_TEMP/game/data" "$RUNNER_TEMP/game/config.php"; mkdir "$RUNNER_TEMP/game/data"
          bash tests/walk.sh "$RUNNER_TEMP/game" 8781 tests/router.php | tee "$RUNNER_TEMP/walk.out"
          grep -q '^installed' "$RUNNER_TEMP/walk.out"
          ! grep -E '^\s*FAIL|Fatal' "$RUNNER_TEMP/walk.out"
      - name: Test suites
        run: bash tests/ci_suites.sh
        env:
          DEFAULT_SUITES: >-
            adventure pfight pfight_sim pfight_js pfboard_sim pfboard_v1 pfboard_v1_page pfdeck_v1 pfdeck_reset pf_creatures_import pfboard_v1_abil pfboard_v1_ai pbox_v1 pfv1_charm pfv1_costly pfv1_guide pf_play_decks pfboard pfboard_js pfengine_js pfmap fight_events fight_scene fight_scene_trail trail_back trail_mini lair_levels road_kinds trail_camps trail_marks trail_decor_edit trail_decor_page wearables tailor tailor_page art_2701 gnome_wear ruin_scene pf_learner trail_sights_270 trail_sights here_bang trail_reverse landing_home animals120 animals140 beds breeding110 calling clock contest craft eggs110 events explore fix100
            fresh_hold friends fun games140 games2 garden100 gear help jobs landmarks market100 pest148 rebuild buildplans rewards
            roadlife roads roads097 roadtext scenes social tools town trade gourmand
            comm cook delvemap flowers gather099 gather150 images mentors120 modr pantry pjobs prog security190
            sinks097 social100 stops100 satchel stopthemes stopkinds popart roadkinds folkoverlay trekshell updrollback villagers worms yard puzzles puzzles_upload puzzles_tourney puzzles_daily jigsaw jigsaw_tourney catfish puzzle_pals landing css_lint redirects home_slim tour here heredo
          PORT_BASE: '8800'
          SHARD: ${{ matrix.shard }}
          SHARDS: '4'
          RETRY_SUITES: 'pbox_v1 fight_scene fight_scene_trail here heredo catfish pfboard_v1_page pfv1_charm pfengine_js gnome_wear puzzle_pals tour gourmand pfdeck_v1'   # browser or timing-sensitive suites get one retry; a pass on retry is logged as flaky

  upgrade:
    name: Upgrade from an older release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, gd
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
      - name: 'Fresh install vs upgrade from an older commit (2.7.01: the source zips are no longer in git, so the old game/ comes from git history)'
        run: |
          rev=$(git rev-list --first-parent HEAD | sed -n '31p'); [ -n "$rev" ] || rev=$(git rev-list --max-parents=0 HEAD | tail -1)
          echo "upgrading from $rev"
          git archive --format=zip -o "$RUNNER_TEMP/old-source.zip" "$rev" game
          bash tests/upgrade_check.sh "$RUNNER_TEMP/old-source.zip" 8790

  mysql:
    name: MySQL 8 (install, migrate, upgrade)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gv
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, gd
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
      - name: db_migrate / give_item error handling on MySQL (incl. a 12-way real duplicate race)
        run: php tests/db_errors.php
        env:
          GV_TEST_DRIVER: mysql
          GV_DB_HOST: 127.0.0.1
          GV_DB_PORT: '3307'
          GV_DB_NAME: gv
          GV_DB_USER: root
      - name: Install through install.php and play through (tests/mwalk43.sh, MySQL variant of walk.sh)
        run: |
          cp -r game "$RUNNER_TEMP/game"; rm -rf "$RUNNER_TEMP/game/data" "$RUNNER_TEMP/game/config.php"; mkdir "$RUNNER_TEMP/game/data"
          bash tests/mwalk43.sh "$RUNNER_TEMP/game" 8782 tests/router.php | tee "$RUNNER_TEMP/mwalk.out"
          grep -q '^SKIP' "$RUNNER_TEMP/mwalk.out" && { echo "MySQL was not reachable"; exit 1; }
          ! grep -E '^\s*FAIL|Fatal' "$RUNNER_TEMP/mwalk.out"
      - name: Migrate is idempotent on the installed MySQL database
        run: |
          php -r 'chdir($argv[1]); $_SERVER["HTTP_HOST"]="x"; require "includes/bootstrap.php";
            db_migrate(db(), "mysql"); db_migrate(db(), "mysql");
            if (!empty($GLOBALS["gv_migrate_errors"])) { fwrite(STDERR, implode("\n", $GLOBALS["gv_migrate_errors"])."\n"); exit(1); }
            echo "migrate twice: no errors\n";' "$RUNNER_TEMP/game"
