name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Lint and conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP lint (every .php file)
        run: |
          # combat_math_golden.php redefines random_int() on purpose, which php -l reports as a fatal, so it is skipped
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { php -l "$f"; fail=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -not -name combat_math_golden.php -print0)
          exit $fail
      - name: Merge conflict markers (same check as tests/build_update.sh)
        run: |
          pat='^(<<<<<<<|=======|>>>>>>>)( |$)'
          if grep -rnE "$pat" game tests --include=*.php --include=*.js --include=*.css --include=*.txt --include=*.sh; then
            echo "Merge conflict markers found"; exit 1
          fi

  sqlite:
    name: SQLite suites (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, gd
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
      - name: db_migrate / give_item error handling
        run: php tests/db_errors.php
      - name: Install and playthrough
        run: |
          cp -r game "$RUNNER_TEMP/game"; rm -rf "$RUNNER_TEMP/game/data" "$RUNNER_TEMP/game/config.php"; mkdir "$RUNNER_TEMP/game/data"
          bash tests/walk.sh "$RUNNER_TEMP/game" 8781 tests/router.php | tee "$RUNNER_TEMP/walk.out"
          grep -q '^installed' "$RUNNER_TEMP/walk.out"
          ! grep -E '^\s*FAIL|Fatal' "$RUNNER_TEMP/walk.out"
      - name: Test suites
        run: bash tests/ci_suites.sh
        env:
          DEFAULT_SUITES: >-
            adventure animals120 animals140 beds breeding110 calling clock contest craft eggs110 events explore fix100
            fresh_hold friends fun games140 games2 garden100 gear help jobs landmarks market100 pest148 rebuild rewards
            roadlife roads roads097 roadtext scenes social tools town trade
            comm cook delvemap flowers gather099 gather150 images mentors120 modr pantry pjobs prog security190
            sinks097 social100 stops100 trekshell updrollback villagers worms yard
          PORT_BASE: '8800'

  upgrade:
    name: Upgrade from an older release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, gd
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
      - name: Fresh install vs upgrade from the previous release zip
        run: |
          old=$(ls releases/GnomeVenture-*-source.zip | sort -V | tail -2 | head -1)
          echo "upgrading from $old"
          bash tests/upgrade_check.sh "$old" 8790

  mysql:
    name: MySQL 8 (install, migrate, upgrade)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gv
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, gd
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
      - name: db_migrate / give_item error handling on MySQL (incl. a 12-way real duplicate race)
        run: php tests/db_errors.php
        env:
          GV_TEST_DRIVER: mysql
          GV_DB_HOST: 127.0.0.1
          GV_DB_PORT: '3307'
          GV_DB_NAME: gv
          GV_DB_USER: root
      - name: Install through install.php and play through (tests/mwalk43.sh, MySQL variant of walk.sh)
        run: |
          cp -r game "$RUNNER_TEMP/game"; rm -rf "$RUNNER_TEMP/game/data" "$RUNNER_TEMP/game/config.php"; mkdir "$RUNNER_TEMP/game/data"
          bash tests/mwalk43.sh "$RUNNER_TEMP/game" 8782 tests/router.php | tee "$RUNNER_TEMP/mwalk.out"
          grep -q '^SKIP' "$RUNNER_TEMP/mwalk.out" && { echo "MySQL was not reachable"; exit 1; }
          ! grep -E '^\s*FAIL|Fatal' "$RUNNER_TEMP/mwalk.out"
      - name: Migrate is idempotent on the installed MySQL database
        run: |
          php -r 'chdir($argv[1]); $_SERVER["HTTP_HOST"]="x"; require "includes/bootstrap.php";
            db_migrate(db(), "mysql"); db_migrate(db(), "mysql");
            if (!empty($GLOBALS["gv_migrate_errors"])) { fwrite(STDERR, implode("\n", $GLOBALS["gv_migrate_errors"])."\n"); exit(1); }
            echo "migrate twice: no errors\n";' "$RUNNER_TEMP/game"
