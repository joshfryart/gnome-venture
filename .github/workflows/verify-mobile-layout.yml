name: Verify 2.0.49 mobile layout
on:
  push:
    branches:
      - release/2.0.49-mobile-adventure-layout
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          for f in game/adventure.php game/includes/maps.php game/includes/bootstrap.php game/install.php; do php -l "$f"; done
      - name: Build update packages
        run: bash tests/build_update.sh 2.0.49 2.0.47 "$GITHUB_WORKSPACE"
      - name: Check ZIPs
        run: |
          unzip -t GnomeVenture-2.0.49-web-update.zip
          unzip -t GnomeVenture-2.0.49-web-update-FULL.zip
