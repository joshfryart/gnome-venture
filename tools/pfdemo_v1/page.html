<title>Puzzle Combat v1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*CSS*/
/* ================= playable demo glue (the game's own stylesheets above are untouched) ================= */
body{padding-bottom:calc(var(--bar,56px) + 8px)}
.hbtn{flex:none;min-height:36px;min-width:36px;padding:0 9px;margin:0;font:600 12px/1 var(--font);color:var(--on-fill);background:rgba(242,228,192,.16);border:1px solid rgba(242,228,192,.32);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.hbtn:hover{background:rgba(242,228,192,.3)}
.hbtn:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
#b-theme svg{width:16px;height:16px}
@media (min-width:721px){   /* the demo has no side menu: its three tabs use the phone bar on a wide screen too */
  .bottombar{display:flex;align-items:flex-start;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);height:calc(var(--bar) + var(--sab));padding-bottom:var(--sab)}
  .bottombar a{flex:1 1 0;min-width:0;height:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:0;padding:0;border-top:2px solid transparent;color:var(--ink-2);font:500 12px/1.1 var(--font)}
  .bottombar span{font-size:22px;line-height:1}
  .bottombar a.on{color:var(--brand-ink);border-top-color:var(--brand);font-weight:600}
}
.bottombar a{text-decoration:none;cursor:pointer}
.bottombar a.dim{opacity:.45}
.wrap>main{min-width:0;flex:1;width:100%}
.pfv-pick .hint{margin:6px 0}
.crgrid{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.crb{display:grid;justify-items:center;gap:1px;width:100%;min-width:0;padding:4px 2px;margin:0;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer}
.crb img{height:28px;max-width:56px;object-fit:contain;image-rendering:pixelated}
.crb b{font-size:10.5px;line-height:1.15;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crb small{font-size:9.5px;line-height:1.1;color:var(--muted);display:inline-flex;gap:3px;align-items:center}
.crb.on{border-color:var(--brand);background:var(--brand-soft)}
.crb:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.szd{display:inline-block;width:7px;height:7px;background:var(--muted)}
.szd.medium{width:9px;height:9px}.szd.large{width:11px;height:11px}.szd.boss{width:11px;height:11px;background:var(--danger);transform:rotate(45deg)}
.pfv .note.warn{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
main>.note{margin:8px 0 0}
.sheetbg{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.5);border:0;padding:0;margin:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:88%;overflow-y:auto;background:var(--surface);color:var(--ink);border-top:2px solid var(--ol);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:420px;margin:0 auto;display:grid;gap:6px}
.sheet h2{margin:0;font-size:16px;flex:1 1 auto!important;min-width:0}
.sheet .hrow{margin:0;display:flex!important;flex-wrap:nowrap!important;align-items:center;gap:8px}
.sheet .hrow .btn{flex:none;margin:0}
.tune{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:0 8px;align-items:center;font-size:12.5px}
.tune label{font-size:12.5px;font-weight:600}
.tune output{font:700 12px/1 var(--font);text-align:right;font-variant-numeric:tabular-nums}
.tune input[type=range]{grid-column:1/-1;width:100%;margin:0;height:26px}
.tune small{grid-column:1/-1;color:var(--muted);font-size:11px;line-height:1.2;margin-top:-2px}
.tsel{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;justify-content:space-between}
.tsel select{flex:none;min-height:30px;font:inherit;font-size:12.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2)}
</style>
<div id="gv">
  <header class="banner"><div class="bannerin">
    <span class="logo">Gnome Venture <small>v1 demo</small></span>
    <button type="button" class="hbtn" id="b-tune" aria-label="Open tuning">Tuning</button>
    <button type="button" class="hbtn" id="b-theme" aria-label="Switch light and dark"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </div></header>
  <div class="wrap"><main id="main" aria-live="polite"><div class="box"><p class="hint">Loading the pieces…</p></div></main></div>
  <nav class="bottombar" id="nav" aria-label="Demo screens">
    <a href="#" data-go="box"><span aria-hidden="true">🧩</span>Box</a><a href="#" data-go="creatures"><span aria-hidden="true">🐾</span>Creatures</a><a href="#" data-go="adventure"><span aria-hidden="true">⚔️</span>Fight</a>
  </nav>
</div>
<div id="sheet" hidden></div>
