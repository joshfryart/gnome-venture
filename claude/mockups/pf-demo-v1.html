<style>

/* Layout: five phone-width screens of the real game (Stitched Toy chrome, pfight.css pieces) on a felt backdrop. Tokens, classes and rules come from game/assets/style.css and game/assets/pfight.css. */
:root{color-scheme: light;
  
  --bg: #f1ece0; --surface: #fff3c8; --surface-2: #f2e4c0;
  --ink: #2a1a10; --ink-2: #4a2c1a; --muted: #74462a;
  --line: #c9a96e; --line-2: #9a6b3f;
  --brand: #2f5a2a; --brand-ink: #2f5a2a; --brand-soft: #c8d09f; --brand-line: #7ab55c;   
  --accent: #e8a317; --accent-soft: #fff3c8; --accent-ink: #7a4a1f; --accent-line: #e8a317;
  --danger: #a8241f; --danger-soft: #f6b8cf; --danger-ink: #6b1b2c; --danger-line: #e46a9b;
  --info-soft: #a9d6ea; --info-ink: #1f4a6a; --info-line: #3f8fb0;   
  --purple: #4e3a8a; --purple-soft: #c3b2ea; --purple-ink: #3e2f66;
  --focus: #25637d;
  --brand-fill: #2f5a2a; --badge-bg: #4a2c1a;   
  --radius: 0; --radius-sm: 0; --pill: 0;   
  
  --px: 2px; --on-fill: #f2e4c0;
  --edge-lt: #74462a; --edge-dk: #2a1a10; --drop: #c9a96e; --ol: #2a1a10;
  --thread: #e8a317; --thread-bright: #f5cf6a; --felt: #3d2a1c; --felt-2: #4a2c1a; --felt-ink: #f2e4c0; --felt-muted: #c9a96e;
  --shadow: 2px 2px 0 0 var(--drop); --shadow-2: 0 0 0 2px var(--ol), 6px 6px 0 0 var(--drop);
  --tap: 44px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  
  --hdr: 52px; --sab: min(env(safe-area-inset-bottom, 0px), 14px);   
  --bar: 56px; --strip: 44px; --gut: 16px; --maxw: 1392px;
  
  --plot: #6b4a2b; --sel: #e8b923;
  --t-wild: #9bbd6a; --t-tilled: #7a5634; --t-planted: #5e4026; --t-ready: #8a6a2a; --t-thirsty: #9a7a5a; --t-notill: #4e3a22; --t-nt: #7fbf4a;
  --r-c: #5b6470; --r-u: #2f5a2a; --r-r: #25637d; --r-l: #7a4a1f;   
  --map-sea: #a9d3e3; --map-road: #6e4f2e;   
  
  --bg-2: transparent; --good: #2f8a3a; --bad: #c0392b; --card: transparent; --panel: rgba(0,0,0,.12);}
:root{--box-bg: #fff3c8;
  --chip-energy-bg: #fff3c8; --chip-energy-ink: #7a4a1f; --chip-energy-line: #e8a317;
  --chip-gold-bg: #f5cf6a; --chip-gold-ink: #2a1a10; --chip-gold-line: #b07a10;
  --chip-lvl-bg: #c8d09f; --chip-lvl-ink: #2f5a2a; --chip-lvl-line: #7ab55c;
  --area: #2f5a2a; --area-solid: #2f5a2a; --area-soft: #c8d09f; --area-ink: #2f5a2a; --area-line: #7ab55c;}
.gvpg[data-area="garden"]{--area: #2f5a2a; --area-solid: #2f5a2a; --area-soft: #c8d09f; --area-ink: #2f5a2a; --area-line: #7ab55c;}
.gvpg[data-area="world"]{--area: #3f8fb0; --area-solid: #25637d; --area-soft: #a9d6ea; --area-ink: #1f4a6a; --area-line: #3f8fb0;}
.gvpg[data-area="kitchen"]{--area: #e0501f; --area-solid: #a8241f; --area-soft: #ffc27a; --area-ink: #6b1b2c; --area-line: #f08a24;}
.gvpg[data-area="book"]{--area: #7a5cc0; --area-solid: #4e3a8a; --area-soft: #c3b2ea; --area-ink: #3e2f66; --area-line: #7a5cc0;}
.gvpg[data-area="market"]{--area: #b07a10; --area-solid: #7a4a1f; --area-soft: #fff3c8; --area-ink: #7a4a1f; --area-line: #e8a317;}
.gvpg[data-area="community"]{--area: #e46a9b; --area-solid: #6b1b2c; --area-soft: #f6b8cf; --area-ink: #6b1b2c; --area-line: #e46a9b;}
*, *::before, *::after{box-sizing: border-box;}
.gvpg{margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--font);}
img, svg{max-width: 100%;}
a{color: var(--brand-ink);}
main a:not(.btn):hover{text-decoration: underline;}
h1, h2, h3, h4{color: var(--ink); font-family: var(--font); font-weight: 600; line-height: 1.25;}
h1{font-size: 22px; margin: 0 0 10px;}
h2{font-size: 18px; margin: 18px 0 8px;}
h3{font-size: 16px; margin: 12px 0 6px;}
p{margin: 0 0 10px;}
small{font-size: 13px;}
hr{border: 0; border-top: 1px solid var(--line); margin: 14px 0;}
code{font-family: var(--mono); font-size: 13px;}
blockquote{margin: 8px 0; padding: 6px 12px; border-left: 4px solid var(--brand-line); background: var(--brand-soft); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;}
.muted{color: var(--muted);}
.good{color: var(--brand-ink); font-weight: 600;}
.help{color: var(--muted); font-size: 13px; margin: -2px 0 10px;}
[hidden], input[hidden]{display: none !important;}
:focus-visible{outline: 2px solid var(--focus); outline-offset: 2px;}
.hp{position: absolute; left: -9999px;}
a.skip{position: absolute; left: 8px; top: -80px; z-index: 100; background: var(--brand-fill); color: var(--on-fill); padding: 10px 16px; border-radius: var(--radius-sm); font-weight: 600; text-decoration: none;}
a.skip:focus{position: fixed; top: 8px;}
.banner{display: contents;}
.bannerin{position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 8px; height: var(--hdr); background: linear-gradient(90deg, #2f6a3a 0% 50%, #4f9a45 50% 100%); border-bottom: 1px solid #2f5a2a;
  padding: 0 max(var(--gut), calc((100% - var(--maxw)) / 2 + var(--gut)));}
.banner .logo{color: var(--on-fill); font-size: 18px; font-weight: 700; text-decoration: none; white-space: nowrap; letter-spacing: -.01em; margin-right: auto;}
.banner .logo small{font-size: 12px; font-weight: 600; background: rgba(242, 228, 192, .22); color: #f1ece0; padding: 2px 8px; border-radius: var(--pill); vertical-align: middle;}
.banner .tagline{display: none; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;}
.userbar{order: 2; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-fill);}
.userbar strong{display: none; font-weight: 600;}
.userbar form.inline{display: none;}
.userbar .linkbtn{color: var(--on-fill);}
.hdr-pill{display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: var(--pill); background: rgba(242, 228, 192, .16); border: 1px solid rgba(242, 228, 192, .32);
  color: var(--on-fill); font-size: 14px; font-weight: 600; white-space: nowrap; text-decoration: none;}
.hdr-pill.hdr-coins{background: #fff3c8; border-color: #c9a96e; color: #6a4510;}
.menubtn{order: 3; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); min-width: var(--tap); padding: 0 12px; margin: 0;
  background: rgba(242, 228, 192, .14); color: var(--on-fill); border: 1px solid rgba(242, 228, 192, .45); border-radius: var(--radius-sm); font: 600 15px/1 var(--font); white-space: nowrap; cursor: pointer; -webkit-appearance: none; appearance: none;}
.menubtn:hover{background: rgba(242, 228, 192, .26);}
.statusstrip{background: var(--bg); border-bottom: 1px solid var(--line);}
.statusin{display: flex; align-items: center; gap: 8px; max-width: var(--maxw); margin: 0 auto; padding: 6px var(--gut); height: var(--strip);
  overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch;}
.statusin::-webkit-scrollbar{display: none;}
.statusstrip .st{flex: none; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--pill);
  background: var(--surface); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; color: var(--ink);}
.statusstrip .st small{color: var(--muted);}
.statusstrip a{color: inherit; text-decoration: none; display: flex; align-items: center; gap: 4px; min-height: var(--tap); margin: -6px -12px; padding: 0 12px; border-radius: var(--pill);}
.statusstrip a:hover{text-decoration: underline;}
.statusstrip .st.energy{background: var(--chip-energy-bg); color: var(--chip-energy-ink); border-color: var(--chip-energy-line);}

.statusstrip .st.energy small{color: inherit;}
.statusstrip .st.hot{background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600;}
.statusstrip .st.title{color: var(--muted); font-style: italic;}
.statusstrip progress.ebar{width: 56px; height: 8px; max-width: 56px;}
.wrap{max-width: var(--maxw); margin: 12px auto 0; padding: 0 var(--gut);}
main{min-width: 0; max-width: 100%;}
main:focus{outline: none;}
footer{text-align: center; color: var(--muted); padding: 20px var(--gut); font-size: 13px;}
footer a{color: inherit;}
.userbar .hdr-pill{height: 36px;}
header .menubtn{font-size: 0; width: var(--tap); padding: 0;}
header .menubtn > span{font-size: 22px;}
.userbar form.inline{display: none;}
.linkbtn{min-height: var(--tap);}
.gvpg{padding-bottom: calc(var(--bar) + var(--sab) + 12px);}
.statusstrip .st.energy{display: none;}
.statusstrip .st.hot{order: -1;}
.bottombar a{position: relative;}
.bottombar .barpip{position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 0; background: var(--accent); color: var(--on-fill);
    font: 700 10px/16px var(--font); box-shadow: 0 0 0 2px var(--surface);}
.bottombar{display: none;}
.bottombar{display: flex; align-items: flex-start; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line);
    height: calc(var(--bar) + var(--sab)); padding-bottom: var(--sab); -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none;}
.bottombar a, .bottombar .menubtn.more{flex: 1 1 0; min-width: 0; height: var(--bar); order: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    margin: 0; padding: 0; background: none; border: 0; border-top: 2px solid transparent; border-radius: 0; color: var(--ink-2); font: 500 12px/1.1 var(--font); text-decoration: none; cursor: pointer;}
.bottombar span{font-size: 22px; line-height: 1;}
.bottombar a.on{color: var(--brand-ink); border-top-color: var(--brand); font-weight: 600;}
.bottombar a:active, .bottombar .menubtn.more:active{background: var(--surface-2);}
.flash{padding: 8px 12px; margin: 4px 0; border-radius: var(--radius-sm); border-left: 4px solid var(--brand); background: var(--brand-soft); font-size: 14px; line-height: 1.4; color: var(--ink);}
.flash.err{border-left-color: var(--danger); background: var(--danger-soft); color: var(--danger-ink);}
.flash{margin: 0 0 12px;}
.box{background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow);}
.box > :first-child{margin-top: 0;}
.box > :last-child{margin-bottom: 0;}
.btn, button.btn{position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 8px 16px; margin: 0;
  background: var(--brand-fill); color: var(--on-fill); border: 1px solid transparent; border-radius: var(--radius-sm); font: 600 15px/1.25 var(--font); text-align: center; text-decoration: none; cursor: pointer; -webkit-appearance: none; appearance: none;}
.btn:hover{background: var(--brand-ink); color: var(--on-fill);}
.btn:active{transform: translateY(1px);}
.btn.small{min-height: 36px; padding: 4px 12px; font-size: 14px;}
.btn.small::after{content: ''; position: absolute; inset: -4px -2px;}
.btn.ghost, .btn.alt, .btn.pickbtn{background: var(--surface); color: var(--ink); border-color: var(--line-2);}
.btn.ghost:hover, .btn.alt:hover, .btn.pickbtn:hover{background: var(--surface-2); color: var(--ink);}
.btn.red{background: var(--danger);}
.btn.red:hover{background: var(--danger-ink);}
.btn.gold{background: var(--accent); color: var(--ink);}
.btn.gold:hover{background: #b07a10; color: var(--ink);}
.btn small{font-weight: 400;}
.btn.pickbtn{max-width: 100%; white-space: normal; text-align: left; justify-content: flex-start;}
button[disabled], .btn[disabled]{opacity: .5; cursor: not-allowed;}
.linkbtn{background: none; border: 0; padding: 0 8px; color: var(--brand-ink); text-decoration: underline; cursor: pointer; font: inherit; font-size: 14px;}
form.inline{display: inline;}
:where(input:not([type=checkbox], [type=radio], [type=range], [type=hidden], [type=submit], [type=button], [type=file], [type=color]), select, textarea){min-height: var(--tap); padding: 8px 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--radius-sm); font: 400 16px/1.3 var(--font); max-width: 100%;}
:where(textarea){min-height: 96px;}
:where(select){padding-right: 6px;}
:where(input[type=checkbox], input[type=radio]){width: 20px; height: 20px; accent-color: var(--brand); margin: 0 6px 0 0; vertical-align: middle;}
:where(input[type=file]){font: inherit; font-size: 14px; max-width: 100%;}
input:focus-visible, select:focus-visible, textarea:focus-visible{outline: 2px solid var(--focus); outline-offset: 1px;}
label{font-size: 14px;}
input[type=range]{accent-color: var(--brand);}
progress, meter{accent-color: var(--brand);}
progress{--fill: var(--brand); -webkit-appearance: none; appearance: none; width: 100%; max-width: 360px; height: 10px; border: 0; border-radius: var(--pill); background: var(--line); overflow: hidden;}
progress::-webkit-progress-bar{background: var(--line);}
progress::-webkit-progress-value{background: var(--fill); border-radius: var(--pill);}
progress::-moz-progress-bar{background: var(--fill);}
meter{height: 10px;}
.tabs, .chips:has(> a, > button){display: flex; flex-wrap: nowrap; gap: 8px; margin: 8px 0 12px; padding: 4px 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;}
.chips{display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px;}
.tabs::-webkit-scrollbar, .chips::-webkit-scrollbar{display: none;}
.tabs a, .tabs button, .chips a, .chips button{position: relative; flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 6px 14px; background: var(--surface-2); color: var(--ink);
  border: 1px solid transparent; border-radius: var(--pill); font: 500 14px/1.2 var(--font); text-decoration: none; white-space: nowrap; cursor: pointer;}
.tabs a::after, .chips a::after, .chips button::after{content: ''; position: absolute; inset: -4px -2px;}
.tabs a:hover, .tabs button:hover, .chips a:hover, .chips button:hover{background: var(--line); color: var(--ink); text-decoration: none;}
.tabs a.on, .chips a.on, .chips button.on{background: var(--brand-fill); color: var(--on-fill); font-weight: 600;}
.chips small{opacity: .8;}
.chip{display: inline-block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--pill); padding: 1px 10px; font-size: 13px; white-space: nowrap;}
.chips.small .chip{font-size: 12px; padding: 0 8px;}
.box{background: var(--box-bg);}
.gvpg[data-area] .wrap{border-top: 3px solid var(--area); padding-top: 12px; margin-top: 0;}
.gvpg[data-area] main h1{border-bottom: 3px solid var(--area); padding-bottom: 4px;}
.gvpg[data-area] .tabs a.on{background: var(--area-solid); color: var(--on-fill);}
.st{--st-ink: hsl(var(--sh, 100) 45% 26%); --st-soft: hsl(var(--sh, 100) 45% 94%); --st-line: hsl(var(--sh, 100) 32% 70%); --st-mid: hsl(var(--sh, 100) 40% 38%);}
.st{margin-bottom: 16px;}
:root{--wx-good-bg: #f1ece0; --wx-good-ink: #2f5a2a; --wx-warn-bg: #f2e4c0; --wx-warn-ink: #6a4510;
  --pest-bg: #f1ece0; --pest-ink: #ae2a2a; --pest-line: #f6b8cf; --rain-bg: #f1ece0; --rain-ink: #3e2f66; --rain-line: #a9d6ea;
  --mood-del: #2f5a2a; --mood-sulk: #6a4510;}
.chip.chip-in{background: var(--brand-soft); color: var(--brand-ink); border-color: var(--brand-line);}

.tbadge{display: inline-block; min-width: 1.35em; padding: 0 6px; margin-left: 4px; border-radius: 0; background: var(--brand-fill); color: var(--on-fill); font-size: .78em; font-weight: 700; line-height: 1.5; text-align: center;}

.tbadge.muted{background: var(--line); color: var(--ink); font-weight: 600;}

.pfight{--pf-hurt: #d55e00; --pf-guard: #0072b2; --pf-heal: #009e73; --pf-charm: #cc79a7; --pf-soothe: #56b4e9; --pf-trick: #f0e442; --pf-item: #e69f00; --pf-ink: #2a1a10; --pf-cream: #f2e4c0; display: grid; gap: .6rem;}
.pfight progress{width: 100%; height: 1rem;}
.pf-foe, .pf-me{display: grid; gap: .2rem;}
.pf-strip{display: flex; gap: .3rem; overflow-x: auto; min-height: 3.4rem; padding: .3rem; border: 2px dashed currentColor; border-radius: .6rem; align-items: center; scroll-snap-type: x proximity;}
.pf-hand{display: flex; flex-wrap: wrap; gap: .9rem .9rem; justify-content: center;}
.pf-tile{position: relative; display: grid; grid-template-columns: 2rem 1fr 2rem; align-items: center; justify-items: center; color: var(--pf-ink); font: inherit; text-align: center; touch-action: manipulation; border: 3px solid var(--pf-ink); border-radius: .5rem; background-color: var(--pf-cream); background-size: 10px 10px; overflow: visible; padding: 0;}
.pf-h{width: 6.3rem; height: 5.2rem; grid-template-rows: 1fr auto; padding-bottom: .2rem; cursor: pointer;}
.pf-s{width: 4.6rem; height: 2.8rem; grid-template-columns: 1.3rem 1fr 1.3rem; flex: 0 0 auto; scroll-snap-align: end;}
.pf-ico{grid-column: 2; line-height: 1; background: var(--pf-cream); border-radius: 50%; padding: .1rem;}
.pf-h .pf-ico{font-size: 1.7rem;}
.pf-s .pf-ico{font-size: 1.05rem;}
.pf-nm{grid-column: 1 / 4; grid-row: 2; font-size: .8rem; font-weight: bold; line-height: 1.1; background: var(--pf-cream); padding: 0 .3rem; border-radius: .25rem;}
.pf-val{position: absolute; top: -.1rem; left: 50%; transform: translateX(-50%); min-width: 1.3rem; padding: 0 .25rem; border-radius: .6rem; background: var(--pf-ink); color: var(--pf-cream); font-weight: bold; font-size: .8rem; line-height: 1.2rem;}
.pf-s .pf-val{font-size: .7rem; line-height: 1rem; min-width: 1.1rem;}
.pf-hurt{background-color: var(--pf-hurt);   background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.28) 0 3px, transparent 3px 8px); border-style: solid;}
.pf-guard{background-color: var(--pf-guard);  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.3) 0 2px, transparent 2px 8px), repeating-linear-gradient(90deg, rgba(255,255,255,.3) 0 2px, transparent 2px 8px); border-style: double; border-width: 5px;}
.pf-heal{background-color: var(--pf-heal);   background-image: radial-gradient(circle, rgba(255,255,255,.55) 0 2px, transparent 2.5px); border-style: dotted; border-width: 4px;}
.pf-charm{background-color: var(--pf-charm);  background-image: radial-gradient(circle, rgba(255,255,255,.7) 0 3.5px, transparent 4px); background-size: 14px 14px; border-style: dashed;}
.pf-soothe{background-color: var(--pf-soothe); background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 2px, transparent 2px 6px); border-style: dashed; border-width: 4px;}
.pf-trick{background-color: var(--pf-trick);  background-image: conic-gradient(rgba(0,0,0,.22) 25%, transparent 0 50%, rgba(0,0,0,.22) 0 75%, transparent 0); background-size: 12px 12px; border-style: groove; border-width: 5px;}
.pf-item{background-color: var(--pf-item);   background-image: none; border-style: ridge; border-width: 5px;}
.pf-tile.by-me{box-shadow: 0 0 0 2px var(--pf-cream), 0 0 0 4px var(--pf-ink);}
.pf-tile.by-foe{outline: 3px dotted var(--pf-ink); outline-offset: 2px; transform: skewX(-6deg);}
.pf-sock{grid-row: 1; display: grid; place-items: center; width: 1.7rem; height: 1.7rem; font-size: .8rem; font-weight: bold; background: var(--pf-ink); color: var(--pf-cream);}
.pf-s .pf-sock{width: 1.2rem; height: 1.2rem; font-size: .65rem;}
.pf-sock.l{grid-column: 1; justify-self: start; margin-left: -.45rem;}
.pf-sock.r{grid-column: 3; justify-self: end; margin-right: -.45rem;}
.pf-sock.hole{background: var(--pf-cream); color: var(--pf-ink); box-shadow: inset 0 0 0 2px var(--pf-ink);}
.pf-sock.f-body{border-radius: 50%;}
.pf-sock.f-mind{clip-path: polygon(50% 0, 100% 0, 100% 62%, 78% 62%, 78% 100%, 22% 100%, 22% 62%, 0 62%, 0 0); border-radius: 40% 40% 0 0;}
.pf-sock.f-craft{clip-path: polygon(50% 0, 100% 100%, 0 100%);}
.pf-sock.f-flat{border-radius: 0; height: .7rem;}
.pf-hand .pf-tile:focus-visible, .pfight .btn:focus-visible{outline: 3px solid Highlight; outline-offset: 2px;}
.pf-hand .pf-picked{transform: translateY(-.35rem) scale(1.04); box-shadow: 0 .35rem 0 rgba(0,0,0,.35), 0 0 0 3px Highlight;}
.pf-ord{position: absolute; top: -.6rem; left: -.4rem; min-width: 1.4rem; height: 1.4rem; border-radius: 50%; background: CanvasText; color: Canvas; font-size: .85rem; line-height: 1.4rem; z-index: 2;}
.pf-extra{display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;}

.pf-nm{overflow-wrap: anywhere; max-height: 2.3em; overflow: hidden;}
.pf-tg{font-size: .75rem;}
.pf-tags{margin: 0; padding-left: 1.1rem; font-size: .8rem;}
.pbox-list{list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem;}
.pbox-item{display: flex; align-items: center; gap: .6rem; padding: .3rem; border: 1px solid currentColor; border-radius: .5rem;}
.pbox-item input{width: 1.4rem; height: 1.4rem; flex: 0 0 auto;}

.pf-box{font-size: .9rem;}

.pbox-pick .btn{width: 100%; text-align: left;}
.pbox-up{margin: 0 0 .5rem;}
.pf-screen{gap: .5rem;}
.pf-hist{list-style: none; margin: 0; padding: .3rem; display: flex; gap: .4rem; overflow-x: auto; border-bottom: 2px solid currentColor; scroll-snap-type: x proximity;}
.pf-chip{flex: 0 0 auto; display: inline-flex; align-items: center; gap: .25rem; padding: .15rem .5rem; border: 2px solid currentColor; border-radius: .5rem; font-size: .75rem; white-space: nowrap; scroll-snap-align: end;}
.pf-chip.foe{border-style: dashed;}
.pf-chip.empty{border-style: none; opacity: .7;}
.pfh-ico{width: 20px; height: 20px; image-rendering: pixelated; vertical-align: middle;}
.pfh-who{font-size: .65rem; letter-spacing: .05em;}
.pf-stage{display: grid; gap: .5rem; grid-template-columns: 1fr 1fr; grid-template-areas: "me foe" "center center"; align-items: start;}
.pf-side{display: grid; gap: .2rem; justify-items: center; text-align: center;}
.pf-side.pf-me{grid-area: me;}
.pf-side.pf-foe{grid-area: foe;}
.pf-center{grid-area: center; display: grid; gap: .4rem;}
.pf-sprite{position: relative; display: grid; place-items: center; min-height: 5.5rem;}
.pf-sprite img{image-rendering: pixelated; max-height: 6rem; width: auto;}
.pf-nameplate{padding: .1rem .8rem; border: 2px solid currentColor; border-radius: .4rem; font-size: .9rem;}
.pf-intent-bubble{position: absolute; top: -.2rem; right: -.4rem; padding: .1rem .3rem; border: 2px solid currentColor; border-radius: .6rem; background: Canvas; color: CanvasText; line-height: 1;}
.pf-hp{display: flex; align-items: center; gap: .3rem; font-size: .8rem;}
.pf-hp progress{width: 6rem; height: .8rem;}
.pf-board{min-height: 5.6rem; justify-content: flex-start; align-items: center;}
.pf-buttons{display: flex; gap: .5rem;}
.pf-buttons .btn{flex: 1 1 0;}
.pf-buttons .primary{flex: 2 1 0;}
.pf-tray{display: grid; grid-template-columns: auto 1fr auto; gap: .4rem; align-items: center;}
.pf-pile{display: grid; justify-items: center; width: 3.4rem; padding: .25rem .1rem; border: 2px dashed currentColor; border-radius: .5rem; font-size: .7rem; line-height: 1.1;}

.pf-pile-emo{font-size: 1.3rem;}
.pf-hand{flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; gap: .5rem; padding: .5rem .2rem .3rem; scroll-snap-type: x proximity;}
.pf-hand .pf-tile{flex: 0 0 auto; scroll-snap-align: center;}
.pf-inspect{display: flex; gap: .6rem; align-items: center; padding: .4rem; border: 2px solid currentColor; border-radius: .6rem;}

.pf-ipiece{position: relative; display: block; width: 228px; height: 136px; flex: 0 0 auto;}

.pf-barhint::before, .pf-bartip::before{content: ''; position: absolute; top: -7px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: #e8a317;}
.pf-bartip{padding: .45rem .6rem; width: min(92%, 21rem); text-align: left;}
.pf-barhint[hidden], .pf-bartip[hidden]{display: none;}
.pfc-meav{display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none;}
.pf-guard{position: relative; display: block; width: 46px; height: 13px; border: 2px solid #0a3a63; border-radius: 3px; background: rgba(0, 20, 40, .65); overflow: hidden; box-sizing: border-box;}
.pf-guard .gfill{position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: repeating-linear-gradient(135deg, #3f9bd0 0 3px, #0072b2 3px 6px); transition: width .45s ease-out;}
.pf-guard b{position: relative; z-index: 1; display: block; text-align: center; font: 700 .62rem/9px system-ui, sans-serif; color: #fff; text-shadow: 0 0 2px #00203a, 0 0 2px #00203a;}
.pf-guard::before{content: '\1F6E1'; position: absolute; left: 1px; top: -1px; z-index: 1; font-size: .55rem; line-height: 11px;}
.pf-guard-0{opacity: .45;}
.pfb-num{position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); z-index: 3; max-width: 96%; padding: 0 .3em; border-radius: .6em; background: rgba(20, 20, 20, .82); color: #fff; font: 700 .62rem/1.25 system-ui, sans-serif; white-space: nowrap; pointer-events: none;}
.pfb-num-hurt{background: #8f1d1d;}
/* ---- page shell (mockup only) ---- */
html{font-size:15px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--felt);color:var(--felt-ink);font:400 1rem/1.5 var(--font);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.intro{max-width:420px;margin:0 auto 18px}
.intro h1{color:var(--felt-ink);font-size:22px;margin:0 0 6px;border:0}
.intro p{color:var(--felt-muted);font-size:14px;margin:0 0 10px}
.intro .jump{display:flex;flex-wrap:wrap;gap:6px}
.intro .jump a,.intro .jump button{font:600 13px/1 var(--font);padding:9px 10px;min-height:36px;background:var(--felt-2);color:var(--felt-ink);border:1px solid var(--felt-muted);border-radius:0;text-decoration:none;cursor:pointer}
.intro .jump a:hover,.intro .jump button:hover{background:var(--brand-fill)}
.intro details{margin:10px 0 0;font-size:13px;color:var(--felt-muted)}
.intro summary{cursor:pointer;color:var(--felt-ink);font-weight:600}
.intro ul{margin:6px 0 0;padding-left:1.1rem}
.screens{display:flex;flex-wrap:wrap;gap:30px 26px;justify-content:center;align-items:flex-start}
.shot{width:390px;max-width:100%;min-width:0}
.cap{margin:0 0 8px;color:var(--felt-ink);font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.cap small{color:var(--felt-muted);font-weight:400;font-size:12px}
.gvpg{position:relative;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font);border:2px solid var(--ol);box-shadow:var(--shadow-2);overflow:hidden;width:100%}
.gvpg .bannerin{position:relative}
.gvpg .bottombar{position:relative;display:flex;left:auto;right:auto;bottom:auto}
.gvpg .wrap{margin-top:0;padding-bottom:18px;min-height:0!important}
.gvpg main{display:block}
.gvpg .menubtn .ico,.gvpg .hdr-pill .ico{width:16px;height:16px}
.changes{margin:8px 0 0;font-size:13px;color:var(--felt-muted)}
.changes summary{cursor:pointer;color:var(--felt-ink);font-weight:600}
.changes ul{margin:4px 0 0;padding-left:1.1rem}
.changes b{color:var(--felt-ink)}
/* ---- screen content (real classes; only the layout glue below is new) ---- */
.gvpg{--L-base:#3f8fb0;--L-reg:#7ab55c;--L-rar:#e8a317;--L-uni:#e46a9b}
.gvpg .box{padding:10px 16px 12px}
.gvpg progress{display:block;width:100%;height:12px}
.hrow{display:flex;align-items:center;gap:6px;margin:0 0 6px;min-width:0}
.hrow h2{margin:0;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .chip{margin:0;flex:none;font-weight:700;font-size:12px;padding:1px 6px}
.chip.good{background:var(--brand-soft);color:var(--brand-ink)}
.chip.warn{background:var(--accent-soft);color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent)}
.sl{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:8px 0 3px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sl span{font-weight:600;text-transform:none;letter-spacing:0}
/* piece cell: art, value, tag icon, name, expiry pips; rarity = border */
.pcg{--z:.5;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pcg.c5{--z:.37;grid-template-columns:repeat(5,minmax(0,1fr))}
.pcg>li{min-width:0;position:relative}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;min-width:0;min-height:0;padding:2px 0 3px;margin:0;border:2px solid var(--line);border-radius:0;background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer;text-align:center;overflow:hidden}
.pc .pfight{display:block;flex:none;width:calc(130px*var(--z));height:calc(80px*var(--z));gap:0}
.pc .pf-tile.pf-art{zoom:var(--z)}
.pc .pfa-n,.pc .pfa-tg{display:none}
.pc-v,.pc-t{position:absolute;top:0;min-width:15px;height:15px;padding:0 2px;font:700 10px/15px var(--font);background:#2a1a10;color:#f2e4c0;z-index:2}
.pc-v{left:0;min-width:calc(50px*var(--z));text-align:center}.pc-t{right:0;font-size:10px;text-align:center}
.pc-n{display:block;max-width:100%;padding:0 2px;font-size:10.5px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcg.c5 .pc-n{font-size:9.5px}
.pc-x{display:flex;gap:2px;height:4px}
.pc-x i{width:7px;height:4px;background:var(--accent);box-shadow:0 0 0 1px var(--ol)}
.pc-x.few i{background:var(--danger)}
.pc.r1{border-color:var(--line-2)}.pc.r2{border-color:#4f9a45}.pc.r3{border-color:#3f8fb0}
.pc.r4{border-color:#e8a317;box-shadow:0 0 0 1px #f5cf6a,0 0 7px 1px #e8a317}
.pc.gear{border-style:dashed}
.pc.sel{background:var(--brand-soft)}
.pc.sel::after,.pc.lock::after{content:'✓';position:absolute;right:0;bottom:0;width:13px;height:13px;font:700 10px/13px var(--font);background:var(--brand-fill);color:var(--on-fill)}
.pc.lock::after{content:'';background:var(--muted);clip-path:polygon(0 45%,22% 45%,22% 0,78% 0,78% 45%,100% 45%,100% 100%,0 100%)}
.pc.off{opacity:.4}
.pc.fixed{cursor:default}
.pc.out{outline:3px solid var(--danger);outline-offset:-1px;z-index:1}
.pc.in{outline:2px solid #4f9a45;outline-offset:-1px}
.pc:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.pc.L-base{border-top:5px solid var(--L-base)}.pc.L-reg{border-top:5px solid var(--L-reg)}.pc.L-rar{border-top:5px solid var(--L-rar)}.pc.L-uni{border-top:5px solid var(--L-uni)}
.slot{display:grid;place-items:center;height:100%;min-height:calc(80px*var(--z) + 6px);border:2px dashed var(--line-2);color:var(--muted);font-size:11px;font-weight:700;line-height:1.1;text-align:center}
.pinfo{display:flex;align-items:center;gap:6px;min-height:34px;margin:6px 0 0;padding:2px 8px;font-size:12px;line-height:1.25;color:var(--ink-2);background:var(--surface-2);border-left:4px solid var(--accent)}
.pinfo .btn{min-height:26px;padding:1px 8px;font-size:12px;margin-left:auto;flex:none}
.kits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 2px 2px}
.kits .btn{min-height:32px;padding:2px 4px;margin:0;font-size:13px}
.actrow{display:flex;gap:8px;align-items:center;margin:10px 2px 2px}
.actrow .btn{margin:0;min-height:40px;padding:4px 12px}
.actrow .grow{flex:1}
/* meters */
.stack{display:flex;flex:1;height:18px;gap:2px;min-width:0}
.stack span{display:flex;align-items:center;justify-content:center;gap:2px;min-width:0;overflow:hidden;white-space:nowrap;font:700 10px/1 var(--font);color:#2a1a10}
.stack .ico{width:11px;height:11px}
.stack .k{background:#7ab55c}.stack .b{background:#3f8fb0}.stack .p{background:#e46a9b}
.stack .body{background:#d6322b;color:#fff}.stack .mind{background:#7a5cc0;color:#fff}.stack .craft{background:#e8a317}
.tally{display:flex;height:18px;gap:2px;margin:8px 0 4px}
.tally span{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;font:700 10px/1 var(--font);color:#2a1a10}
.capp{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.capp i{width:9px;height:9px;transform:rotate(45deg);border:2px solid #3f8fb0;margin:0 1px}
.capp i.on{background:#3f8fb0}
.capp.mw i{border-color:#e8a317}.capp.mw i.on{background:#e8a317;box-shadow:0 0 5px #e8a317}
.meter{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.meter>b{font-size:15px;font-variant-numeric:tabular-nums}
.gvpg .tabs{margin:0 0 8px}
.gvpg .tabs a{min-height:32px;padding:2px 9px}
.gvpg .chips.fbar{flex-wrap:nowrap;gap:5px;margin:6px 0 2px;padding:2px}
.gvpg .chips.fbar button{flex:1;min-height:28px;padding:2px 4px;font-size:12px}
.gvpg .chips.seg{margin:0 0 8px;padding:2px;gap:6px}
.gvpg .chips.seg button{flex:1;min-height:30px;padding:2px 6px}
.dur{position:relative;display:block;width:100%;height:7px;border:1px solid var(--ol);background:var(--surface);overflow:hidden}
.dur i{display:block;height:100%;background:#4f9a45;transition:width .25s}
.dur.low i{background:#e8a317}.dur.zero i,.dur.crit i{background:#d6322b}
.bslot .dur{margin-top:3px}
.bslot small{display:block;text-align:center;font-size:10px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.toolrow{display:flex;gap:8px;align-items:center;padding:3px 6px;border:2px solid var(--line);background:var(--surface-2)}
.toolrow.t2{border-color:#4f9a45}.toolrow.t3{border-color:#3f8fb0}.toolrow.t4{border-color:#e8a317;box-shadow:0 0 5px #e8a317}
.toolrow.broken{border-style:dashed;border-color:var(--danger)}
.toolrow .ti{flex:none;width:22px;text-align:center;font-size:18px;line-height:1}
.toolrow .ti .ico{width:20px;height:20px}
.toolrow .tx{flex:1;min-width:0;display:grid;gap:2px;font-size:12px;line-height:1.2}
.toolrow .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolrow .tx small{font-size:10px;color:var(--muted);font-weight:400;float:right;font-variant-numeric:tabular-nums}
.toolrow .btn{flex:none;min-height:28px;min-width:66px;padding:1px 6px;font-size:11px;margin:0}
.pips{display:inline-flex;gap:3px;vertical-align:-1px}
.pips i{width:9px;height:9px;border:2px solid var(--accent);display:inline-block}
.pips i.on{background:var(--accent)}
.uprow{display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:12px;text-align:left;cursor:pointer}
.uprow.rare{border-color:#3f8fb0}
.uprow .ui{font-size:18px;flex:none}.uprow .ui .ico{width:20px;height:20px}
.uprow small{display:block;font-size:11px;color:var(--muted)}
.uprow .chip{margin-left:auto;font-size:11px}
/* creature header */
.foecard{display:flex;gap:10px;align-items:center;padding:4px 0 2px}
.foecard .pic{flex:none;width:66px;height:50px;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line)}
.foecard .pic img{max-width:60px;max-height:44px;image-rendering:pixelated}
.foecard .fx{flex:1;min-width:0}
.foecard h3{margin:0 0 2px;font-size:15px;display:flex;align-items:baseline;gap:6px}.foecard h3 small{font-size:11px;font-weight:600;color:var(--muted)}
.foecard .chips{margin:0 0 3px;gap:2px}
.foecard .chip{font-size:11px;padding:0 5px;margin:1px}
.foecard .stack{height:12px}.foecard .stack span{font-size:9px}
.sw{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:4px 8px;border:2px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:38px;height:20px;margin:0;border:2px solid var(--ol);background:var(--surface);cursor:pointer}
.sw input::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;background:var(--muted);transition:left .15s}
.sw input:checked{background:#4f9a45}
.sw input:checked::after{left:20px;background:#f2e4c0}
.sw input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sw .chip{margin:0 0 0 auto;font-size:12px}
.gvpg .chips.clsbar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 0 6px;padding:2px}
.gvpg .chips.clsbar button{min-height:34px;padding:2px}
.clsbar .ico{width:22px;height:22px}
.clshead{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin:0 0 4px;font-size:13px}
.clshead .chip{font-size:11px;padding:0 5px;margin:1px}
.clshead small{flex-basis:100%;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;margin-right:3px;border:1px solid var(--ol)}
.s4wrap{margin:0}
.s4wrap .pfight{color:var(--ink);--pf-ink:#2a1a10}
.xp{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);z-index:4;display:flex;gap:2px;padding:2px;background:rgba(24,14,8,.88);pointer-events:none}
.xp i{width:6px;height:4px;background:#e8a317}
.xp i.e{background:#5a4636}
.xp.last i:not(.e){background:#ff6a4a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= playable demo (layout glue on top of the approved mockup's rules) =================
   Layout: one phone-width game page (the Stitched Toy chrome) on the felt backdrop; the fight is a dark felt table inside it. */
body{padding-block:10px 28px}
.demo{max-width:420px;margin:0 auto}
.gvpg{min-height:560px;display:flex;flex-direction:column}
.gvpg>.wrap{flex:1;width:100%;box-sizing:border-box}
#b-theme svg{width:16px;height:16px}
.demo .gvpg{padding-bottom:0!important}
.gvpg .wrap{padding:0 8px 12px}
.gvpg .box{padding:10px 10px 12px;margin:8px 0 0}
.gvpg .bannerin{padding:0 8px;gap:6px}
.gvpg .logo small{margin-left:4px}
.hbtn{flex:none;min-height:36px;min-width:36px;padding:0 9px;margin:0;font:600 12px/1 var(--font);color:var(--on-fill);background:rgba(242,228,192,.16);border:1px solid rgba(242,228,192,.32);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.hbtn:hover{background:rgba(242,228,192,.3)}
.hbtn:focus-visible,.bottombar a:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.gvpg .bottombar a{text-decoration:none}
.gvpg .bottombar a.dim{opacity:.45}
.gvpg .bottombar .ico{width:22px;height:22px}
.pc canvas{display:block;width:100%;max-width:74px;height:auto;margin:0 auto;image-rendering:pixelated}
.pc-v{min-width:17px}
.pc.sel::after,.pc.lock::after{z-index:2}
.pcg.c5 .pc-n{font-size:9px}
.hint{margin:6px 0 0;font-size:12px;line-height:1.3;color:var(--muted)}
.teamrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 0;font-size:11px;color:var(--muted)}
.teamrow .chip{font-size:11px;padding:0 6px;margin:0}
.teamrow .chip.off{opacity:.5;text-decoration:line-through}
.note{margin:8px 0 0;padding:6px 8px;font-size:12px;line-height:1.3;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line)}
.note b{color:inherit}
.gvpg .sw{font-size:12.5px;gap:6px}.gvpg .sw .chip{font-size:11px;padding:0 5px}
/* creature picker */
.crgrid{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.crb{display:grid;justify-items:center;gap:1px;width:100%;min-width:0;padding:4px 2px;margin:0;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer}

.tg.step{border-color:transparent;background:none;color:var(--fm);padding:0 2px}.tg.step.on{color:#fff;border-color:#e8a317;background:rgba(232,163,23,.25);padding:0 5px}
.dots{display:inline-flex;gap:2px}.dots i{width:7px;height:7px;border:1px solid var(--fm);border-radius:50%}.dots i.on{background:#e8a317;border-color:#e8a317}.dots i.over{background:#ff6a4a;border-color:#ff6a4a}
.board{position:relative;width:100%;margin:0 auto;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 2px rgba(0,0,0,.45);touch-action:manipulation}
.board>*{position:absolute;margin:0;padding:0}
.board canvas,.board img{display:block;width:100%;height:100%;image-rendering:pixelated}
.gc{box-shadow:inset 0 0 0 1px rgba(242,228,192,.06)}
.g-sun{background:radial-gradient(circle at 50% 50%,rgba(255,214,90,.55),rgba(255,190,40,.22))}
.g-br{background:repeating-linear-gradient(45deg,rgba(74,122,48,.6) 0 4px,rgba(36,66,26,.6) 4px 8px)}
.g-mud{background:repeating-linear-gradient(0deg,rgba(122,90,58,.75) 0 5px,rgba(92,66,40,.75) 5px 10px)}
.gf{pointer-events:none;z-index:3}
.gf.g-sun{background:none;box-shadow:inset 0 0 0 2px #ffd65a}
.gf.g-br{background:none;box-shadow:inset 0 0 0 2px #7ab55c}
.gf.g-mud{background:none;box-shadow:inset 0 0 0 2px #a67c52}
.gf svg{position:absolute;right:1px;bottom:1px;width:11px;height:11px;padding:1px;background:rgba(20,12,6,.8)}
.gf.g-sun svg{color:#ffd65a}.gf.g-br svg{color:#9fd67d}.gf.g-mud svg{color:#d9b48a}
.bp{z-index:2;border:0;background:none;cursor:pointer}
.bp.blank{display:grid;place-items:center;color:#f2e4c0;font-size:14px;cursor:default}
.bp.blank::before{content:'';position:absolute;inset:14% 13%;border:2px dashed #c9a96e;background:rgba(242,228,192,.12)}
.bp.fnew canvas{filter:drop-shadow(0 0 3px #ff8a6a) drop-shadow(0 0 1px #ff8a6a)}
.bp.glow canvas{filter:drop-shadow(0 0 3px #ffe27a) drop-shadow(0 0 2px #e8a317) brightness(1.2)}
.bp.insp canvas{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff)}
.bv{position:absolute;left:17%;top:13%;min-width:19%;height:auto;padding:0 1px;font:700 10px/12px var(--font);text-align:center;color:#2a1a10;background:#f2e4c0;box-shadow:0 0 0 1px #2a1a10;font-variant-numeric:tabular-nums;pointer-events:none}
.xp{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:4;display:flex;gap:1px;padding:1px;background:rgba(24,14,8,.9);pointer-events:none}
.xp i{width:5px;height:3px;background:#e8a317}.xp i.e{background:#5a4636}.xp.last i:not(.e){background:#ff6a4a}
.fl{position:absolute;right:14%;top:13%;padding:0 2px;font:700 9px/11px var(--font);font-style:normal;color:#fff;background:#8a2c1e;pointer-events:none}
.jt{z-index:3;pointer-events:none}
.lit{z-index:5;border:0;background:rgba(232,163,23,.14);cursor:pointer}
.lit canvas{opacity:.9}
.lit.sel{background:rgba(232,163,23,.45)}
.lit:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.ln{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:0;font:700 11px/11px var(--font);text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000;white-space:nowrap;pointer-events:none}
.ln .h{color:#ff9a86}.ln .c{color:#ffa9cf}.ln .g{color:#9bd4ec}.ln .l{color:#a9e08f}.ln .n{color:#f2e4c0}.ln .u{color:#ff6a4a;font-size:9px}.ln .t{color:#a9e08f;font-size:9px}
.mk{z-index:6;pointer-events:none}
.mk svg{position:absolute;left:1px;top:1px;width:13px;height:13px;padding:1px;background:rgba(20,12,6,.85)}
.mk.aim{box-shadow:inset 0 0 0 2px #ff6a4a;animation:pulse 1.4s ease-in-out infinite}
.mk.aim svg{color:#ff8a6a;left:auto;right:1px}
.mk.aim b{position:absolute;right:16px;top:1px;padding:0 2px;font:700 10px/15px var(--font);color:#ffd9cf;background:rgba(20,12,6,.85)}
.mk.ev{box-shadow:inset 0 0 0 2px #e8a317;outline:1px dashed rgba(232,163,23,.0)}
.mk.ev svg{color:#ffd65a}
.mk.zone{box-shadow:inset 0 0 0 1px rgba(255,106,74,.9);background:rgba(255,106,74,.14)}
.mk.ev.k-thorn{box-shadow:inset 0 0 0 2px #ff6a4a}.mk.ev.k-thorn svg{color:#ff8a6a}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px rgba(255,106,74,.35)}}
.fb-info{display:flex;align-items:center;gap:6px;min-height:40px;padding:3px 6px;font-size:11.5px;line-height:1.25;background:rgba(0,0,0,.3);border-left:3px solid #e8a317}
.fb-info>span{flex:1;min-width:0}
.fb-info .btn{flex:none;min-height:32px;padding:2px 10px;font-size:13px;margin:0}
.fb-info b{color:#fff}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.hc{position:relative;display:grid;justify-items:center;gap:1px;min-width:0;padding:2px 0 3px;margin:0;border:1px solid transparent;background:none;color:var(--fi);font:inherit;cursor:pointer;transition:transform .12s}
.hc canvas{display:block;width:100%;max-width:74px;height:auto;image-rendering:pixelated}
.hc .bv{left:17%;top:8%;font-size:11px;line-height:13px}
.hc .hn{max-width:100%;font-size:9.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .xp{position:static;transform:none;background:none;padding:0}
.hc .xp i{width:6px;height:3px}
.hc.sel{transform:translateY(-4px);border-color:#e8a317;background:rgba(232,163,23,.18)}
.hc.none{opacity:.45}
.hc .src{position:absolute;right:2px;top:2px;width:13px;height:13px;display:grid;place-items:center;background:rgba(20,12,6,.85)}
.hc .src .ico{width:11px;height:11px}
.hc:focus-visible{outline:2px solid #fff;outline-offset:1px}
.piles{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fm)}
.fb-log{max-height:70px;overflow-y:auto;padding:3px 6px;font-size:10.5px;line-height:1.4;background:rgba(0,0,0,.3);color:var(--fm)}
.fb-log div{white-space:normal}
.fb-log b{display:inline-block;min-width:16px;color:var(--fm);font-variant-numeric:tabular-nums}
.fb-log .me{color:#d5ecc4}.fb-log .foe{color:#ffd0c4}.fb-log .env{color:#ffe3a0}.fb-log .sys{color:var(--fm)}
/* playback: the site's own classes do the work (pf-turn, pfb-drop, pfb-scoring, pfb-leaving, pfb-spawn, pf-chip-in, pfb-glow, pfb-stamp); below is only the glue */

.pf-turn-env{background:#2f5a2a;color:#f2e4c0;border:2px solid #7ab55c}

.bp.pfb-gone{cursor:default;z-index:2}

    ['bramble', 'Bramble damage', 0, 0.25, 0.01, function (v) { return Math.round(v * 100) + '%'; }, 'Share of max health a piece on bramble costs its owner each round.'],
    ['sun', 'Ground strength', 1, 3, 0.25, function (v) { return '×' + v.toFixed(2); }, 'Sunny cell: factor on a Hurt or Charm piece standing on it.'],
    ['limit', 'Use-up limit', 0, 5, 1, function (v) { return v ? v + '+' : 'off'; }, 'A chain that fires this many pieces uses them all up (both sides).'],
    ['lvl', 'Your level', -8, 4, 1, function (v) { return (v > 0 ? '+' : '') + v; }, 'Gnome level against the creature\'s level (0 = at level).']];
  function tuneSheet() {
    var t = tune(), h = '<div class="hrow"><h2>Tuning</h2><button type="button" class="btn ghost small" data-a="treset">Reset</button><button type="button" class="btn small" data-a="sclose">Done</button></div>'
      + '<p class="note"><b>Provisional.</b> These are the sim 3 numbers. Changes apply to the next fight.</p>';
    TR.forEach(function (r) { h += '<div class="tune"><label for="tu-' + r[0] + '">' + r[1] + '</label><output id="to-' + r[0] + '" for="tu-' + r[0] + '">' + r[5](t[r[0]]) + '</output><input type="range" id="tu-' + r[0] + '" data-k="' + r[0] + '" min="' + r[2] + '" max="' + r[3] + '" step="' + r[4] + '" value="' + t[r[0]] + '"><small>' + r[6] + '</small></div>'; });
    h += '<label class="tsel" for="tu-anim">Animation speed <select id="tu-anim" data-k="anim">' + [['1', '1× (as the site)'], ['2', '2×'], ['skip', 'skip']].map(function (o) { return '<option value="' + o[0] + '"' + (String(t.anim) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>';
    h += '<label class="tsel" for="tu-nev">Events a round <select id="tu-nev" data-k="nev">' + [['auto', 'by size (1 small, 2 others)'], ['0', 'none'], ['1', '1'], ['2', '2'], ['3', '3']].map(function (o) { return '<option value="' + o[0] + '"' + (String(t.nev) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>'
      + '<label class="tchk" for="tu-br_half"><input type="checkbox" id="tu-br_half" data-k="br_half"' + (t.br_half ? ' checked' : '') + '>Halve bramble on creature pieces</label>'
      + '<label class="tchk" for="tu-big"><input type="checkbox" id="tu-big" data-k="big"' + (t.big ? ' checked' : '') + '>Every board 7×5 (size is only a look)</label>'
      + '<div class="sl">Open questions from sim 3</div><ol><li>Tougher creature bars for 6-8 turn fights, or today\'s bars and 4-5 turns?</li><li>Board size changes nothing in the numbers: keep it as a look?</li><li>Events cost little to ignore: make them hit harder?</li><li>Bramble gives away 14-21% of the creature\'s bar: halve it on creatures?</li></ol>'
      + (F && !F.s.over ? '<div class="actrow"><button type="button" class="btn primary grow" data-a="refight">↺ Restart this fight with these numbers</button></div>' : '');
    return h;
  }
  function deckSheet() {
    var s = F.s, rows = {}, add = function (t, w) { var r = rows[t.n] = rows[t.n] || { n: t.n, t: t.t, v: t.v, w: {} }; r.w[w] = (r.w[w] || 0) + 1; };
    s.me.hand.forEach(function (t) { add(t, 'hand'); }); s.me.draw.forEach(function (t) { add(t, 'draw'); }); s.me.discard.forEach(function (t) { add(t, 'discard'); });
    for (var id in s.pcs) if (s.pcs[id].by === 'me') add(s.pcs[id].tile, 'board');
    return '<div class="hrow"><h2>🧩 Your deck</h2><button type="button" class="btn small" data-a="sclose">Done</button></div><p class="note">Locked for this fight. Change it in the Puzzle box or before the next fight.</p><ul class="decklist">'
      + Object.keys(rows).sort().map(function (k) { var r = rows[k]; return '<li><span>' + esc(r.n) + ' <small>' + TYPE[r.t] + ' ' + r.v + '</small></span><small>' + Object.keys(r.w).map(function (w) { return w + (r.w[w] > 1 ? ' ×' + r.w[w] : ''); }).join(', ') + '</small></li>'; }).join('') + '</ul>';
  }
  function drawSheet() {
    if (!ui.sheet) { sheet.hidden = true; sheet.innerHTML = ''; return; }
    sheet.hidden = false;
    sheet.innerHTML = '<button type="button" class="sheetbg" data-a="sclose" aria-label="Close"></button><div class="sheet" role="dialog" aria-label="' + (ui.sheet === 'tune' ? 'Tuning' : 'Your deck') + '"><div class="sheet-in">' + ico(ui.sheet === 'tune' ? tuneSheet() : deckSheet()) + '</div></div>';
  }
  sheet.addEventListener('input', function (ev) {
    var el = ev.target, k = el.getAttribute('data-k'); if (!k) return;
    if (el.type === 'range') { sv.tune[k] = +el.value; var r = TR.filter(function (x) { return x[0] === k; })[0], o = document.getElementById('to-' + k); if (o && r) o.textContent = r[5](+el.value); }
    else if (el.type === 'checkbox') sv.tune[k] = el.checked;
    else sv.tune[k] = el.value;
    save();
  });
  sheet.addEventListener('change', function (ev) { if (ev.target.getAttribute('data-k') && screen !== 'fight') draw(); });

  // ------------------------------------------------------------------ drawing and actions
  var SCREENS = { starter: starter, box: box, pre: pre, fight: fight, result: result };
  function draw() {
    pend = [];
    main.innerHTML = screen === 'fight' ? fight() : ico(SCREENS[screen]());
    mount(main);
    var bl = main.querySelectorAll('[data-bk]');
    if (bl.length) { var set = function () { Array.prototype.forEach.call(bl, function (b) { b.style.width = b.getAttribute('data-bw'); }); };
      Array.prototype.forEach.call(bl, function (b) { ui.barPrev[b.getAttribute('data-bk')] = b.getAttribute('data-bw'); });
      if (speed()) { void main.offsetWidth; requestAnimationFrame(set); } else set(); }
    var items = screen === 'fight' ? [['🧩', 'Deck', 'deck', 0], ['⚠️', 'Give up', 'giveup', 0], ['🔧', 'Tuning', 'tune', 0]]
      : [['🧩', 'Box', 'nbox', screen === 'box' || screen === 'starter'], ['⚔️', 'Creatures', 'npre', screen === 'pre'], ['🔧', 'Tuning', 'tune', 0]];
    nav.innerHTML = ico(items.map(function (it) { return '<a href="#" role="button" data-a="' + it[2] + '"' + (it[3] ? ' class="on" aria-current="page"' : '') + '><span aria-hidden="true">' + it[0] + '</span>' + it[1] + '</a>'; }).join(''));
    drawSheet();
  }
  function say(h) { ui.info = h; }
  var ACT = {
    // starter
    sinfo: function (id) { say(desc(PFD.byId(PFD.PIECES, id), 'core, always in')); },
    spick: function (id) { var i = ui.picked.indexOf(id); if (i >= 0) ui.picked.splice(i, 1); else if (ui.picked.length < 6) ui.picked.push(id); say(desc(PFD.byId(PFD.PIECES, id))); },
    sgear: function (id) { var p = gearPiece(id); if (p) say(desc(p, 'gear, added free')); },
    kit: function (k) { ui.picked = PFD.KITS[k].slice(); say('<span><b>' + k.charAt(0).toUpperCase() + k.slice(1) + ' kit</b> packed. Tap pieces to change it.</span>'); },
    sgo: function () { sv.kit = PFD.CORE.concat(ui.picked); sv.started = true; save(); screen = 'box'; say('<span><b>Box packed.</b> 10 kit pieces, plus your gear. Change anything here, then find a creature.</span>'); },
    restart: function () { ui.picked = sv.kit.filter(function (id) { return PFD.OFFER.indexOf(id) >= 0; }).slice(0, 6); screen = 'starter'; say(''); },
    // box and pre-fight
    tab: function (t) { ui.tab = t; say(''); },
    filt: function (f) { ui.filt = f; },
    kin: function (id) { var p = PFD.byId(PFD.PIECES, id), b = PFD.capBlock(sv, p); if (b) { say('<span><b>' + esc(b) + '</b></span>'); return; } sv.kit.push(id); save(); say(desc(p, 'packed')); },
    kout: function (id) { var p = PFD.byId(PFD.PIECES, id); sv.kit = sv.kit.filter(function (q) { return q !== id; }); save(); say(desc(p, 'taken out')); },
    dgear: function (id) { var p = gearPiece(id); if (p) say(desc(p, 'gear: change it in the box')); },
    dlock: function (id) { var p = gearPiece(id) || PFD.byId(PFD.PIECES, id); if (p) say(desc(p, 'locked (Auto deck)')); },
    btier: function (i) { sv.beltTier = +i; sv.belt = sv.belt.slice(0, PFD.BELT_SLOTS[sv.beltTier]); save(); say('<span><b>Belt ' + ['I', 'II', 'III'][sv.beltTier] + '</b>: ' + PFD.BELT_SLOTS[sv.beltTier] + ' tool slots. Belts are bought, not crafted.</span>'); },
    tool: function (id) {
      var t = PFD.byId(PFD.TOOLS, id), i = sv.belt.indexOf(id);
      if (i >= 0) { sv.belt.splice(i, 1); say(desc(t.p, 'off the belt')); }
      else { var b = PFD.capBlock(sv, t.p); if (b) { say('<span><b>' + esc(b) + '</b></span>'); return; } if (sv.belt.length >= PFD.BELT_SLOTS[sv.beltTier]) return; sv.belt.push(id); say(desc(t.p, 'on the belt')); }
      save();
    },
    tinfo: function (id) { var t = PFD.byId(PFD.TOOLS, id); say(desc(Object.assign({ gear: 1 }, t.p), t.name + ' ' + sv.dur[id] + '/' + PFD.toolMax(t))); },
    fix: function (id) { var t = PFD.byId(PFD.TOOLS, id); sv.dur[id] = PFD.toolMax(t); save(); say('<span><b>' + esc(t.name) + '</b> fixed with a crafted repair kit. Put it back on the belt.</span>'); },
    pal: function (id) {
      var q = PFD.byId(PFD.PALS, id), i = sv.party.indexOf(id);
      if (i >= 0) { sv.party.splice(i, 1); say(desc(q.p, 'left the party')); }
      else { var b = PFD.capBlock(sv, q.p); if (b) { say('<span><b>' + esc(b) + '</b></span>'); return; } if (sv.party.length >= 2) { say('<span><b>The active party holds 2 pals.</b> Take one out first.</span>'); return; } sv.party.push(id); say(desc(q.p, 'in the active party')); }
      save();
    },
    go: function (to) { screen = to; say(''); ui.cinfo = ''; },
    nbox: function () { screen = sv.started ? 'box' : 'starter'; say(''); },
    npre: function () { if (!sv.started) { say('<span><b>Pack your first box</b> before you look for a creature.</span>'); return; } screen = 'pre'; say(''); ui.cinfo = ''; },
    cr: function (slug) { sv.cr = slug; save(); ui.cinfo = ''; say(''); },
    finfo: function (i) { var c = curCreature(), p = PFD.foePieces(c)[+i]; ui.cinfo = '<span><b>' + esc(p.n) + '</b> ' + TYPE[p.t] + ' ' + foeV(c, p.v) + ' · ' + PFD.LAYERS[p.layer] + ' · stays ' + p.life + ' rounds · plays ×2' + tagText(p, true) + '</span>'; },
    auto: function () { sv.auto = !sv.auto; save(); say(''); },
    autooff: function () { sv.auto = false; save(); say(''); },
    fight: function () { if (PFD.deckCheck(sv)) { screen = 'box'; return; } startFight(); return true; },
    // fight
    hand: function (k) { if (F.busy || F.s.over) return; k = +k; F.sel = F.sel === k ? null : k; F.cell = null; F.pv = null; F.insp = null; say(''); },
    cell: function (_, el) {
      if (F.busy || F.sel === null) return; var x = +el.getAttribute('data-x'), y = +el.getAttribute('data-y');
      if (F.cell && F.cell[0] === x && F.cell[1] === y) { doPlay(); return true; }
      var q = litCells().filter(function (c) { return c.x === x && c.y === y; })[0]; if (!q) return;
      F.cell = [x, y]; F.pv = q.pv; say('');
    },
    play: function () { if (F.busy || !F.cell) return; doPlay(); return true; },
    pass: function () { if (F.busy) return; doPass(); return true; },
    insp: function (id) {
      if (Q.on) { skipPlay(); return true; }
      var s = F.s, p = s.pcs[id]; if (!p) return; F.insp = +id; F.cell = null; F.pv = null;
      var t = p.tile, left = p.born + (t.life || 3) - s.round, g = PFE.ter(s, p.x, p.y);
      say('<span><b>' + esc(t.n) + '</b> ' + TYPE[t.t] + ' ' + t.v + ' · ' + (p.by === 'me' ? 'yours' : esc(F.c.name) + (t.layer ? ', ' + PFD.LAYERS[t.layer].toLowerCase() : '')) + ' · ' + left + (left === 1 ? ' round left' : ' rounds left')
        + (p.by === 'foe' ? ' · plays left ' + Math.max(0, 2 - (p.f || 0)) : '') + (g ? ' · on ' + GRN[g].toLowerCase() : '') + tagText(t, p.by === 'foe') + '</span>');
    },
    evinfo: function (k) { var e = F.s.envs[+k]; if (e) say('<span><b>' + EVN[e.kind] + '</b> lands after the creature\'s move: ' + EVT[e.kind] + '.</span>'); },
    giveup: function () { if (!F) return; if (Q.on) { skipPlay(); if (!F) return true; } if (F.busy) return true; finish('fled'); return true; },
    skip: function () { skipPlay(); return true; },
    deck: function () { ui.sheet = 'deck'; },
    refight: function () { ui.sheet = null; stopQ(); startFight(); return true; },
    // sheets
    tune: function () { ui.sheet = 'tune'; },
    sclose: function () { ui.sheet = null; },
    treset: function () { sv.tune = {}; save(); }
  };
  function gearPiece(id) { var o = null; PFD.TOOLS.forEach(function (t) { if (t.p.id === id) o = Object.assign({ gear: 1 }, t.p); }); PFD.PALS.forEach(function (q) { if (q.p.id === id) o = Object.assign({ gear: 1 }, q.p); }); return o; }
  function onAct(ev) {
    var el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
    if (el.tagName === 'A') ev.preventDefault();
    var a = el.getAttribute('data-a'), fn = ACT[a]; if (!fn) return;
    if (el.type === 'checkbox') ev.stopPropagation();
    if (fn(el.getAttribute('data-arg'), el) !== true) draw();
  }
  document.getElementById('app').addEventListener('click', onAct);
  sheet.addEventListener('click', onAct);
  document.getElementById('b-tune').addEventListener('click', function () { ui.sheet = ui.sheet === 'tune' ? null : 'tune'; drawSheet(); });
  document.getElementById('b-theme').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; drawSheet(); } });

  function boot() {
    PP = window.PFParts;
    if (!PP || !PP.ok) { main.innerHTML = '<div class="box"><p class="hint">The piece art did not load.</p></div>'; return; }
    draw();
  }
  if (window.PFParts && window.PFParts.ok) boot(); else { document.addEventListener('pfparts-ready', boot); setTimeout(function () { if (!PP) boot(); }, 4000); }
  window.__demo = { Q: Q, ui: ui, save: function () { return sv; }, fight: function () { return F; }, result: function () { return RES; }, draw: draw, lit: litCells, PFE: PFE, PFD: PFD };
})();
</script>
